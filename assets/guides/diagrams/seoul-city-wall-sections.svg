<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1034" width="1200" height="1034" role="img" aria-labelledby="t d" font-family="'Public Sans','Helvetica Neue',Helvetica,Arial,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><title id="t">The Seoul City Wall in four sections</title><desc id="d">Clockwise from Changuimun: Baegak to Hyehwamun, 4.7 km, about 3 hours, hardest; Naksan to Gwanghuimun, 3.2 km, about 1.5 hours, easiest; Namsan to the Donuimun site, 6.7 km, about 3.5 hours, moderate; Inwangsan back to Changuimun, 4.0 km, about 2.5 hours, hard and rocky. The full loop is 18.6 km, about ten and a half hours of walking.</desc><rect width="1200" height="1034" fill="#ffffff"/><text x="40" y="62" font-size="34" font-weight="800" fill="#251d48" text-anchor="start" >The Seoul City Wall in four sections</text><text x="40" y="100" font-size="24" font-weight="400" fill="#665e79" text-anchor="start" >Official route order, clockwise from Changuimun · schematic, not to scale</text><path d="M423.2 343.2 A250 250 0 0 1 776.8 343.2" fill="none" stroke="#251d48" stroke-width="26" stroke-linecap="butt"/><text x="600.0" y="160.0" font-size="26" font-weight="800" fill="#251d48" text-anchor="middle" >Baegak 백악</text><text x="600.0" y="190.0" font-size="21" font-weight="400" fill="#665e79" text-anchor="middle" >4.7 km · about 3 h</text><text x="600.0" y="218.0" font-size="21" font-weight="700" fill="#251d48" text-anchor="middle" >Hardest</text><path d="M776.8 343.2 A250 250 0 0 1 776.8 696.8" fill="none" stroke="#f4c95d" stroke-width="26" stroke-linecap="butt"/><text x="894.0" y="506.0" font-size="26" font-weight="800" fill="#251d48" text-anchor="start" >Naksan 낙산</text><text x="894.0" y="536.0" font-size="21" font-weight="400" fill="#665e79" text-anchor="start" >3.2 km · about 1.5 h</text><text x="894.0" y="564.0" font-size="21" font-weight="700" fill="#251d48" text-anchor="start" >Easiest</text><path d="M776.8 696.8 A250 250 0 0 1 423.2 696.8" fill="none" stroke="#8a7fb0" stroke-width="26" stroke-linecap="butt"/><text x="600.0" y="852.0" font-size="26" font-weight="800" fill="#251d48" text-anchor="middle" >Namsan 남산</text><text x="600.0" y="882.0" font-size="21" font-weight="400" fill="#665e79" text-anchor="middle" >6.7 km · about 3.5 h</text><text x="600.0" y="910.0" font-size="21" font-weight="700" fill="#251d48" text-anchor="middle" >Moderate</text><path d="M423.2 696.8 A250 250 0 0 1 423.2 343.2" fill="none" stroke="#4a3d7a" stroke-width="26" stroke-linecap="butt"/><text x="306.0" y="506.0" font-size="26" font-weight="800" fill="#251d48" text-anchor="end" >Inwangsan 인왕산</text><text x="306.0" y="536.0" font-size="21" font-weight="400" fill="#665e79" text-anchor="end" >4.0 km · about 2.5 h</text><text x="306.0" y="564.0" font-size="21" font-weight="700" fill="#251d48" text-anchor="end" >Hard, rocky</text><circle cx="423.2" cy="343.2" r="14" fill="#ffffff" stroke="#251d48" stroke-width="5"/><text x="467.0639251369291" y="383.063925136929" font-size="20" font-weight="700" fill="#251d48" text-anchor="middle" >Changuimun</text><text x="467.0639251369291" y="409.063925136929" font-size="18" font-weight="400" fill="#665e79" text-anchor="middle" >창의문</text><circle cx="776.8" cy="343.2" r="14" fill="#ffffff" stroke="#251d48" stroke-width="5"/><text x="732.936074863071" y="383.0639251369291" font-size="20" font-weight="700" fill="#251d48" text-anchor="middle" >Hyehwamun</text><text x="732.936074863071" y="409.0639251369291" font-size="18" font-weight="400" fill="#665e79" text-anchor="middle" >혜화문</text><circle cx="776.8" cy="696.8" r="14" fill="#ffffff" stroke="#251d48" stroke-width="5"/><text x="732.936074863071" y="648.9360748630709" font-size="20" font-weight="700" fill="#251d48" text-anchor="middle" >Gwanghuimun</text><text x="732.936074863071" y="674.9360748630709" font-size="18" font-weight="400" fill="#665e79" text-anchor="middle" >광희문</text><circle cx="423.2" cy="696.8" r="14" fill="#ffffff" stroke="#251d48" stroke-width="5"/><text x="467.0639251369291" y="648.936074863071" font-size="20" font-weight="700" fill="#251d48" text-anchor="middle" >Donuimun site</text><text x="467.0639251369291" y="674.936074863071" font-size="18" font-weight="400" fill="#665e79" text-anchor="middle" >돈의문 터</text><rect x="841.0" y="511.0" width="18" height="18" fill="#ffffff" stroke="#251d48" stroke-width="3" transform="rotate(45 850.0 520.0)"/><text x="816" y="582" font-size="19" font-weight="600" fill="#665e79" text-anchor="end" >Heunginjimun</text><text x="816" y="606" font-size="17" font-weight="400" fill="#665e79" text-anchor="end" >흥인지문</text><rect x="591.0" y="761.0" width="18" height="18" fill="#ffffff" stroke="#251d48" stroke-width="3" transform="rotate(45 600.0 770.0)"/><text x="600.0" y="698.0" font-size="19" font-weight="600" fill="#665e79" text-anchor="middle" >Sungnyemun</text><text x="600.0" y="722.0" font-size="17" font-weight="400" fill="#665e79" text-anchor="middle" >숭례문</text><text x="600" y="514" font-size="28" font-weight="800" fill="#251d48" text-anchor="middle" >Full loop 18.6 km</text><text x="600" y="548" font-size="22" font-weight="400" fill="#665e79" text-anchor="middle" >about 10½ hours of walking</text><path d="M1110 150 l18 44 l-18 -12 l-18 12 z" fill="#251d48"/><text x="1110" y="140" font-size="22" font-weight="800" fill="#251d48" text-anchor="middle" >N</text><text x="40" y="974" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Diamonds mark gates on flat stretches the city folds into the Naksan and Namsan sections.</text><text x="40" y="1006" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Diagram by K-Spot Now from the city&#x27;s official trail pages cited in the guide, checked Oct 25, 2026.</text></svg>
