<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Red Velvet A Day in Red and Velvet official source card</title>
  <desc id="desc">Official Melon Ticket source identity card for Red Velvet FAN-CON A Day in Red and Velvet at Korea University Hwajeong Gymnasium.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#261120"/>
      <stop offset="0.5" stop-color="#7b1838"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ff5d7d"/>
      <stop offset="1" stop-color="#ffd1dc"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" rx="42" fill="url(#bg)"/>
  <rect x="58" y="56" width="1084" height="563" rx="34" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <rect x="90" y="92" width="210" height="210" rx="28" fill="#150814" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
  <circle cx="195" cy="197" r="69" fill="#ff5d7d"/>
  <circle cx="195" cy="197" r="41" fill="#150814"/>
  <circle cx="195" cy="197" r="17" fill="#ffd1dc"/>
  <rect x="90" y="335" width="210" height="54" rx="27" fill="#fff0f4"/>
  <text x="195" y="371" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" fill="#7b1838">K-POP</text>
  <text x="348" y="142" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" letter-spacing="2" fill="#ffd1dc">OFFICIAL TICKET SOURCE</text>
  <text x="348" y="227" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#ffffff">Red Velvet</text>
  <text x="348" y="298" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#ffe6ec">A Day in Red</text>
  <text x="348" y="363" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#ffffff">and Velvet</text>
  <rect x="348" y="418" width="705" height="7" rx="4" fill="url(#accent)"/>
  <text x="348" y="485" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#fff0f4">Korea Univ. Hwajeong Gym / Aug 1-2, 2026</text>
  <text x="348" y="538" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ffc3d1">Source: Melon Ticket</text>
  <rect x="966" y="514" width="88" height="44" rx="22" fill="#fff0f4"/>
  <text x="1010" y="545" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="900" fill="#7b1838">KS</text>
</svg>
