name: Refresh official source candidates

on:
  schedule:
    - cron: "20 */4 * * *"
  workflow_dispatch:
    inputs:
      monitor_urls:
        description: "Comma-separated extra official URLs to scan once"
        required: false
        type: string

concurrency:
  group: official-source-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Import current KMA forecast
        run: npm run import:forecast

      - name: Recheck published live and upcoming events
        run: npm run recheck:published
        env:
          EVENT_RECHECK_TIMEOUT_MS: "12000"
          EVENT_RECHECK_CONCURRENCY: "5"

      - name: Check source availability
        run: npm run check:sources
        env:
          SOURCE_TIMEOUT_MS: "12000"
          SOURCE_CONCURRENCY: "8"

      - name: Collect official page candidates
        run: npm run collect:official
        env:
          COLLECT_TIMEOUT_MS: "15000"
          COLLECT_CONCURRENCY: "8"
          COLLECT_MAX_LINKS: "24"
          COLLECT_MIN_LINK_SCORE: "7"
          MONITOR_URLS: ${{ github.event.inputs.monitor_urls || '' }}

      - name: Build review report
        run: npm run review:feed

      - name: Create draft event candidates
        run: npm run draft:events

      - name: Build private review board
        run: npm run review:board

      - name: Summarize refresh results
        run: npm run source:summary

      - name: Build GitHub issue digest
        run: npm run source:issue

      - name: Stage source review PR package
        run: npm run stage:review-candidates

      - name: Update source review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create source-review --color 0d7f75 --description "Official source monitoring queue" || true
          ISSUE_NUMBER="$(gh issue list --state open --label source-review --json number --jq '.[0].number')"
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --title "Official source review queue" --body-file data/feeds/source-refresh-issue.md --add-label source-review
          else
            gh issue create --title "Official source review queue" --body-file data/feeds/source-refresh-issue.md --label source-review
          fi

      - name: Verify current site data
        run: npm run verify

      - name: Commit operational refresh snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/kma-forecast.json data/source-refresh-summary.json data/published-event-recheck.json
          if git diff --cached --quiet; then
            echo "No operational snapshot changes to commit."
          else
            STASHED_REVIEW_CANDIDATES=0
            if ! git diff --quiet -- data/review-candidates/latest.json data/review-candidates/latest.md || [ -n "$(git ls-files --others --exclude-standard data/review-candidates/latest.json data/review-candidates/latest.md)" ]; then
              git stash push --include-untracked --message "source review candidates" -- data/review-candidates/latest.json data/review-candidates/latest.md
              STASHED_REVIEW_CANDIDATES=1
            fi
            git commit -m "Refresh weather and source summary"
            git pull --rebase origin main
            git push origin HEAD:main
            if [ "$STASHED_REVIEW_CANDIDATES" = "1" ]; then
              git stash pop
            fi
          fi

      - name: Create or update source review PR
        id: source_review_pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ github.token }}
          branch: automation/source-review-candidates
          base: main
          title: "Review official source candidates"
          commit-message: "Stage source review candidates"
          body-path: data/review-candidates/latest.md
          labels: source-review
          add-paths: |
            data/review-candidates/latest.json
            data/review-candidates/latest.md

      - name: Note source review PR fallback
        if: steps.source_review_pr.outcome == 'failure'
        run: |
          {
            echo "### Source review PR fallback"
            echo ""
            echo "The source refresh completed and updated the source-review issue/artifacts, but GitHub did not allow the workflow to create or update the candidate PR."
            echo "Enable repository setting: Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-review-${{ github.run_id }}
          path: data/feeds/
          if-no-files-found: error
          retention-days: 14
