<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1148" width="1200" height="1148" role="img" aria-labelledby="t d" font-family="'Public Sans','Helvetica Neue',Helvetica,Arial,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><title id="t">A pork-barbecue dinner for two, phrase by phrase</title><desc id="d">Say 두 명이요 for two people; the table is set; order 삼겹살 1인분, 목살 1인분 주세요; add 소주 한 병이요 for soju; grill and wrap the meat; ask 불판 갈아 주세요 if the plate scorches; finish with 된장찌개하고 공기밥 하나 주세요 for stew and rice or 후식 냉면 하나 주세요 for cold noodles; pay at the counter.</desc><rect width="1200" height="1148" fill="#ffffff"/><text x="40" y="62" font-size="34" font-weight="800" fill="#251d48" text-anchor="start" >A pork-barbecue dinner for two, phrase by phrase</text><text x="40" y="100" font-size="24" font-weight="400" fill="#665e79" text-anchor="start" >What happens at each stage, and what to say</text><line x1="70" y1="150" x2="70" y2="1018" stroke="#f4c95d" stroke-width="8" stroke-linecap="round"/><circle cx="70" cy="168" r="16" fill="#251d48"/><text x="70" y="175" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" >1</text><text x="110" y="176" font-size="24" font-weight="800" fill="#251d48" text-anchor="start" >Walk in</text><rect x="420" y="142" width="740" height="104" rx="10" fill="#f3f0f9"/><text x="440" y="174" font-size="26" font-weight="800" fill="#251d48" text-anchor="start" >두 명이요</text><text x="440" y="204" font-size="19" font-weight="400" fill="#665e79" text-anchor="start" font-style="italic">du myeong-iyo</text><text x="440" y="232" font-size="20" font-weight="400" fill="#251d48" text-anchor="start" >“Two people.”</text><circle cx="70" cy="286" r="16" fill="#251d48"/><text x="70" y="293" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" >2</text><text x="110" y="294" font-size="24" font-weight="800" fill="#251d48" text-anchor="start" >The table is set</text><text x="440" y="294" font-size="21" font-weight="400" fill="#665e79" text-anchor="start" >Grill on; ssamjang, sesame-oil salt, lettuce and banchan arrive.</text><circle cx="70" cy="356" r="16" fill="#251d48"/><text x="70" y="363" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" >3</text><text x="110" y="364" font-size="24" font-weight="800" fill="#251d48" text-anchor="start" >Order the meat</text><rect x="420" y="330" width="740" height="104" rx="10" fill="#f3f0f9"/><text x="440" y="362" font-size="26" font-weight="800" fill="#251d48" text-anchor="start" >삼겹살 1인분, 목살 1인분 주세요</text><text x="440" y="392" font-size="19" font-weight="400" fill="#665e79" text-anchor="start" font-style="italic">samgyeopsal irinbun, moksal irinbun juseyo</text><text x="440" y="420" font-size="20" font-weight="400" fill="#251d48" text-anchor="start" >“One portion of pork belly and one of pork neck, please.”</text><circle cx="70" cy="474" r="16" fill="#251d48"/><text x="70" y="481" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" >4</text><text x="110" y="482" font-size="24" font-weight="800" fill="#251d48" text-anchor="start" >Something to drink</text><rect x="420" y="448" width="740" height="104" rx="10" fill="#f3f0f9"/><text x="440" y="480" font-size="26" font-weight="800" fill="#251d48" text-anchor="start" >소주 한 병이요</text><text x="440" y="510" font-size="19" font-weight="400" fill="#665e79" text-anchor="start" font-style="italic">soju han byeong-iyo</text><text x="440" y="538" font-size="20" font-weight="400" fill="#251d48" text-anchor="start" >“A bottle of soju.”</text><circle cx="70" cy="592" r="16" fill="#251d48"/><text x="70" y="599" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" >5</text><text x="110" y="600" font-size="24" font-weight="800" fill="#251d48" text-anchor="start" >Grill and wrap</text><text x="440" y="600" font-size="21" font-weight="400" fill="#665e79" text-anchor="start" >Lay strips flat, turn when golden, snip, wrap in lettuce.</text><circle cx="70" cy="662" r="16" fill="#251d48"/><text x="70" y="669" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" >6</text><text x="110" y="670" font-size="24" font-weight="800" fill="#251d48" text-anchor="start" >If the plate scorches</text><rect x="420" y="636" width="740" height="104" rx="10" fill="#f3f0f9"/><text x="440" y="668" font-size="26" font-weight="800" fill="#251d48" text-anchor="start" >불판 갈아 주세요</text><text x="440" y="698" font-size="19" font-weight="400" fill="#665e79" text-anchor="start" font-style="italic">bulpan gara juseyo</text><text x="440" y="726" font-size="20" font-weight="400" fill="#251d48" text-anchor="start" >“Please change the grill plate.”</text><circle cx="70" cy="780" r="16" fill="#251d48"/><text x="70" y="787" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" >7</text><text x="110" y="788" font-size="24" font-weight="800" fill="#251d48" text-anchor="start" >The second act</text><rect x="420" y="754" width="740" height="104" rx="10" fill="#f3f0f9"/><text x="440" y="786" font-size="26" font-weight="800" fill="#251d48" text-anchor="start" >된장찌개하고 공기밥 하나 주세요</text><text x="440" y="816" font-size="19" font-weight="400" fill="#665e79" text-anchor="start" font-style="italic">doenjang-jjigae-hago gonggibap hana juseyo</text><text x="440" y="844" font-size="20" font-weight="400" fill="#251d48" text-anchor="start" >“Soybean stew and a bowl of rice.”</text><circle cx="70" cy="898" r="16" fill="#251d48"/><text x="70" y="905" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" >8</text><text x="110" y="906" font-size="24" font-weight="800" fill="#251d48" text-anchor="start" >…or cold noodles</text><rect x="420" y="872" width="740" height="104" rx="10" fill="#f3f0f9"/><text x="440" y="904" font-size="26" font-weight="800" fill="#251d48" text-anchor="start" >후식 냉면 하나 주세요</text><text x="440" y="934" font-size="19" font-weight="400" fill="#665e79" text-anchor="start" font-style="italic">husik naengmyeon hana juseyo</text><text x="440" y="962" font-size="20" font-weight="400" fill="#251d48" text-anchor="start" >“A small bowl of cold noodles to finish.”</text><circle cx="70" cy="1016" r="16" fill="#251d48"/><text x="70" y="1023" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle" >9</text><text x="110" y="1024" font-size="24" font-weight="800" fill="#251d48" text-anchor="start" >Pay</text><text x="440" y="1024" font-size="21" font-weight="400" fill="#665e79" text-anchor="start" >Take the bill to the counter and pay by card.</text><text x="40" y="1088" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Romanization follows the guide; 인분 (inbun) means one portion, usually at least two to start.</text><text x="40" y="1120" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Diagram by K-Spot Now from the guide&#x27;s worked order and the restaurant rules it cites.</text></svg>
