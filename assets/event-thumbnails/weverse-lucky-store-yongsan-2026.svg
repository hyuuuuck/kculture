  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="56" y="62" fill="#ffffff" font-size="20" font-weight="900" opacity="0.86">K-POP</text>
  <text x="1144" y="62" text-anchor="end" fill="#ffffff" font-size="20" font-weight="900" opacity="0.86">K-POP</text>
