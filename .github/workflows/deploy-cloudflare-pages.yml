name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - "app.js"
      - "assets/**"
      - "data/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
      - "src/**"
      - "styles.css"
      - "wrangler.toml"
  workflow_dispatch:
    inputs:
      require_adsense:
        description: "Require AdSense publisher ID before deploying"
        required: false
        type: boolean
        default: false
      strict_freshness:
        description: "Fail if live/upcoming listings exceed freshness windows"
        required: false
        type: boolean
        default: false
      refresh_sources:
        description: "Refresh official source candidates before building"
        required: false
        type: boolean
        default: true
      monitor_urls:
        description: "Comma-separated extra official URLs to scan once"
        required: false
        type: string

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://kspotnow.com' }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'contact@kspotnow.com' }}
      GOOGLE_ADSENSE_PUBLISHER_ID: ${{ vars.GOOGLE_ADSENSE_PUBLISHER_ID }}
      GOOGLE_ADSENSE_CLIENT: ${{ vars.GOOGLE_ADSENSE_CLIENT }}
      GOOGLE_ADSENSE_SLOT: ${{ vars.GOOGLE_ADSENSE_SLOT }}
      GOOGLE_ADSENSE_CMP_READY: ${{ vars.GOOGLE_ADSENSE_CMP_READY || '0' }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      AGODA_PARTNER_CID: ${{ vars.AGODA_PARTNER_CID }}
      TRIP_ALLIANCE_ID: ${{ vars.TRIP_ALLIANCE_ID }}
      TRIP_ALLIANCE_SID: ${{ vars.TRIP_ALLIANCE_SID }}
      KLOOK_AFFILIATE_AID: ${{ vars.KLOOK_AFFILIATE_AID }}
      TRAZY_AFFILIATE_ID: ${{ vars.TRAZY_AFFILIATE_ID }}
      ALLOW_PLATFORM_SUBDOMAIN: ${{ vars.ALLOW_PLATFORM_SUBDOMAIN || '0' }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || 'kculture' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '338a3c1d6ab632a4c303e44d88e3ec78' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check public deployment configuration
        run: |
          test -n "$SITE_URL" || { echo "SITE_URL repository variable is required."; exit 1; }
          test -n "$CONTACT_EMAIL" || { echo "CONTACT_EMAIL repository variable is required."; exit 1; }
          test -n "$CLOUDFLARE_WORKER_NAME" || { echo "CLOUDFLARE_WORKER_NAME repository variable is required."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID secret is required."; exit 1; }

      # Push deploys build from committed, already-verified data so the release
      # gate stays deterministic. Live source refresh runs in the scheduled
      # source-refresh workflow, or here via manual dispatch with refresh_sources.
      - name: Refresh official source status
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_sources }}
        run: npm run source:refresh
        env:
          SOURCE_TIMEOUT_MS: "12000"
          SOURCE_CONCURRENCY: "8"
          COLLECT_TIMEOUT_MS: "15000"
          COLLECT_CONCURRENCY: "8"
          COLLECT_MAX_LINKS: "24"
          COLLECT_MIN_LINK_SCORE: "7"
          MONITOR_URLS: ${{ inputs.monitor_urls || '' }}

      - name: Build production site
        run: npm run build

      - name: Validate production build
        env:
          REQUIRE_ADSENSE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_adsense && '1' || '0' }}
          STRICT_FRESHNESS: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_freshness && '1' || '0' }}
        run: |
          set -o pipefail
          run_check() {
            label="$1"
            shift
            if ! "$@" 2>&1 | tee /tmp/check-output.log; then
              echo "::error title=${label} failed::$(tail -c 900 /tmp/check-output.log | tr '\n' ' ')"
              exit 1
            fi
          }
          if [ "$REQUIRE_ADSENSE" = "1" ]; then
            run_check "preflight:adsense" npm run preflight:adsense
          else
            run_check "validate:production" npm run validate:production
          fi
          if [ "$STRICT_FRESHNESS" = "1" ]; then
            run_check "validate:content (strict)" env CONTENT_FRESHNESS_STRICT=1 npm run validate:content
          else
            run_check "validate:content" npm run validate:content
          fi
          run_check "validate:sources" npm run validate:sources
          run_check "validate:links" npm run validate:links
          run_check "validate:images" npm run validate:images
          run_check "validate:thumbnail-audit" npm run validate:thumbnail-audit
          run_check "validate:calendar" npm run validate:calendar
          run_check "validate:details" npm run validate:details
          run_check "validate:ux" npm run validate:ux
          run_check "validate:workflows" npm run validate:workflows
          run_check "validate:sitemap" npm run validate:sitemap
          run_check "validate:structured" npm run validate:structured
          run_check "validate:event-audit" npm run validate:event-audit
          run_check "report:adsense" npm run report:adsense
          run_check "quality:ceo" npm run quality:ceo

      - name: Check Cloudflare deploy secret
        id: cloudflare-token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Wrangler deploy skipped::CLOUDFLARE_API_TOKEN is not set. Cloudflare Git-connected builds can still deploy this validated push."
          fi

      - name: Upload source refresh artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-source-refresh-${{ github.run_id }}
          path: data/feeds/
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy to Cloudflare Workers
        if: ${{ steps.cloudflare-token.outputs.available == 'true' }}
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print deployment URL
        if: ${{ steps.cloudflare-token.outputs.available == 'true' }}
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "Deployment alias URL: $DEPLOYMENT_ALIAS_URL"

      - name: Verify live canonical surface
        if: ${{ steps.cloudflare-token.outputs.available == 'true' }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Live canonical audit attempt $attempt of 6"
            if npm run check:domain; then
              exit 0
            fi
            sleep 15
          done
          echo "::error title=Live canonical audit failed::The custom domain did not expose a redirect-free canonical sitemap after deployment."
          exit 1
