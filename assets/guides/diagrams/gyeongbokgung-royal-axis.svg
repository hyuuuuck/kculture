<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1192" width="1200" height="1192" role="img" aria-labelledby="t d" font-family="'Public Sans','Helvetica Neue',Helvetica,Arial,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><title id="t">Gyeongbokgung in one line</title><desc id="d">From south to north on the royal axis: Gwanghwamun main gate, Heungnyemun where tickets are checked, the Yeongjegyo bridge, Geunjeongmun, the Geunjeongjeon throne hall, the Sajeongjeon office, Gangnyeongjeon the king&#x27;s quarters, Gyotaejeon the queen&#x27;s residence and the Amisan garden. Gyeonghoeru stands west of Sajeongjeon and Sujeongjeon west of the axis. Bugaksan rises behind.</desc><rect width="1200" height="1192" fill="#ffffff"/><text x="40" y="62" font-size="34" font-weight="800" fill="#251d48" text-anchor="start" >Gyeongbokgung in one line</text><text x="40" y="100" font-size="24" font-weight="400" fill="#665e79" text-anchor="start" >South to north along the royal axis · schematic, not to scale</text><text x="600" y="150" font-size="22" font-weight="400" fill="#665e79" text-anchor="middle" >Bugaksan 북악산 rises behind · Hyangwonjeong pavilion farther north</text><line x1="600" y1="190" x2="600" y2="1072" stroke="#f4c95d" stroke-width="10" stroke-linecap="round"/><rect x="430.0" y="173.0" width="340" height="74" rx="10" fill="#f3f0f9" stroke="#251d48" stroke-width="2"/><text x="600" y="206" font-size="24" font-weight="800" fill="#251d48" text-anchor="middle" >Amisan  아미산</text><text x="600" y="234" font-size="19" font-weight="400" fill="#665e79" text-anchor="middle" >Terraced garden</text><rect x="430.0" y="277.0" width="340" height="74" rx="10" fill="#f3f0f9" stroke="#251d48" stroke-width="2"/><text x="600" y="310" font-size="24" font-weight="800" fill="#251d48" text-anchor="middle" >Gyotaejeon  교태전</text><text x="600" y="338" font-size="19" font-weight="400" fill="#665e79" text-anchor="middle" >Queen&#x27;s residence</text><rect x="430.0" y="381.0" width="340" height="74" rx="10" fill="#f3f0f9" stroke="#251d48" stroke-width="2"/><text x="600" y="414" font-size="24" font-weight="800" fill="#251d48" text-anchor="middle" >Gangnyeongjeon  강녕전</text><text x="600" y="442" font-size="19" font-weight="400" fill="#665e79" text-anchor="middle" >King&#x27;s sleeping quarters</text><rect x="430.0" y="485.0" width="340" height="74" rx="10" fill="#f3f0f9" stroke="#251d48" stroke-width="2"/><text x="600" y="518" font-size="24" font-weight="800" fill="#251d48" text-anchor="middle" >Sajeongjeon  사정전</text><text x="600" y="546" font-size="19" font-weight="400" fill="#665e79" text-anchor="middle" >King&#x27;s office</text><rect x="410.0" y="589.0" width="380" height="74" rx="10" fill="#251d48" stroke="#251d48" stroke-width="2"/><text x="600" y="622" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" >Geunjeongjeon  근정전</text><text x="600" y="650" font-size="19" font-weight="400" fill="#e9e4f5" text-anchor="middle" >Throne hall</text><rect x="430.0" y="693.0" width="340" height="74" rx="10" fill="#f3f0f9" stroke="#251d48" stroke-width="2"/><text x="600" y="726" font-size="24" font-weight="800" fill="#251d48" text-anchor="middle" >Geunjeongmun  근정문</text><text x="600" y="754" font-size="19" font-weight="400" fill="#665e79" text-anchor="middle" >Gate to the throne hall</text><rect x="430.0" y="797.0" width="340" height="74" rx="10" fill="#f3f0f9" stroke="#251d48" stroke-width="2"/><text x="600" y="830" font-size="24" font-weight="800" fill="#251d48" text-anchor="middle" >Yeongjegyo  영제교</text><text x="600" y="858" font-size="19" font-weight="400" fill="#665e79" text-anchor="middle" >Stone bridge over a channel</text><rect x="430.0" y="901.0" width="340" height="74" rx="10" fill="#f3f0f9" stroke="#251d48" stroke-width="2"/><text x="600" y="934" font-size="24" font-weight="800" fill="#251d48" text-anchor="middle" >Heungnyemun  흥례문</text><text x="600" y="962" font-size="19" font-weight="400" fill="#665e79" text-anchor="middle" >Tickets are checked here</text><rect x="410.0" y="1005.0" width="380" height="74" rx="10" fill="#251d48" stroke="#251d48" stroke-width="2"/><text x="600" y="1038" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle" >Gwanghwamun  광화문</text><text x="600" y="1066" font-size="19" font-weight="400" fill="#e9e4f5" text-anchor="middle" >Main gate</text><rect x="60" y="450" width="330" height="104" rx="10" fill="#ffffff" stroke="#251d48" stroke-width="2" stroke-dasharray="8 6"/><text x="225" y="486" font-size="23" font-weight="800" fill="#251d48" text-anchor="middle" >Gyeonghoeru  경회루</text><text x="225" y="514" font-size="19" font-weight="400" fill="#665e79" text-anchor="middle" >Banquet pavilion on a</text><text x="225" y="538" font-size="19" font-weight="400" fill="#665e79" text-anchor="middle" >square pond, west of the office</text><line x1="390" y1="502" x2="430" y2="502" stroke="#665e79" stroke-width="2"/><rect x="60" y="582" width="330" height="104" rx="10" fill="#ffffff" stroke="#251d48" stroke-width="2" stroke-dasharray="8 6"/><text x="225" y="618" font-size="23" font-weight="800" fill="#251d48" text-anchor="middle" >Sujeongjeon  수정전</text><text x="225" y="646" font-size="19" font-weight="400" fill="#665e79" text-anchor="middle" >On the site of Jiphyeonjeon,</text><text x="225" y="670" font-size="19" font-weight="400" fill="#665e79" text-anchor="middle" >King Sejong&#x27;s research hall</text><path d="M1080 150 l18 44 l-18 -12 l-18 12 z" fill="#251d48"/><text x="1080" y="140" font-size="22" font-weight="800" fill="#251d48" text-anchor="middle" >N</text><text x="600" y="1122" font-size="21" font-weight="400" fill="#665e79" text-anchor="middle" >Sejong-daero, the old avenue of ministries, runs south from the main gate</text><text x="40" y="1166" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Diagram by K-Spot Now from the Gyeongbokgung pages cited in the guide, checked Oct 20, 2026.</text></svg>
