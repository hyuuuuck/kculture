<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 752" width="1200" height="752" role="img" aria-labelledby="t d" font-family="'Public Sans','Helvetica Neue',Helvetica,Arial,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif"><title id="t">Your first jjimjilbang visit, in order</title><desc id="d">Seven steps: put shoes in the shoe locker; pay at the counter for towels, a uniform and a wristband key; undress fully in the single-sex locker room; wash with soap at the showers; use the hot, herbal and cold pools with the towel kept out of the water; put the uniform on for the shared floor with kiln rooms, salt rooms and a snack bar; return the wristband and pay for extras when you leave.</desc><rect width="1200" height="752" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#665e79"/></marker></defs><text x="40" y="62" font-size="34" font-weight="800" fill="#251d48" text-anchor="start" >Your first jjimjilbang visit, in order</text><text x="40" y="100" font-size="24" font-weight="400" fill="#665e79" text-anchor="start" >The fixed sequence most bathhouses follow</text><path d="M299 248.0 L320 248.0" stroke="#665e79" stroke-width="4" marker-end="url(#a)"/><path d="M587 248.0 L608 248.0" stroke="#665e79" stroke-width="4" marker-end="url(#a)"/><path d="M875 248.0 L896 248.0" stroke="#665e79" stroke-width="4" marker-end="url(#a)"/><path d="M1031.5 350 L1031.5 386 L887.5 386 L887.5 418" fill="none" stroke="#665e79" stroke-width="4" marker-end="url(#a)"/><path d="M756.0 524.0 L735.0 524.0" stroke="#665e79" stroke-width="4" marker-end="url(#a)"/><path d="M468.0 524.0 L447.0 524.0" stroke="#665e79" stroke-width="4" marker-end="url(#a)"/><rect x="40" y="150" width="255" height="196" rx="12" fill="#ffffff" stroke="#251d48" stroke-width="2"/><circle cx="74" cy="188" r="20" fill="#251d48"/><text x="74" y="196" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >1</text><text x="106" y="196" font-size="25" font-weight="800" fill="#251d48" text-anchor="start" >Shoe locker</text><text x="60" y="244" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Shoes off at the door;</text><text x="60" y="272" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >keep the small key</text><rect x="328" y="150" width="255" height="196" rx="12" fill="#ffffff" stroke="#251d48" stroke-width="2"/><circle cx="362" cy="188" r="20" fill="#251d48"/><text x="362" y="196" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >2</text><text x="394" y="196" font-size="25" font-weight="800" fill="#251d48" text-anchor="start" >Counter</text><text x="348" y="244" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Pay; collect towels,</text><text x="348" y="272" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >a uniform and a</text><text x="348" y="300" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >wristband key</text><rect x="616" y="150" width="255" height="196" rx="12" fill="#f3f0f9" stroke="#251d48" stroke-width="2"/><circle cx="650" cy="188" r="20" fill="#251d48"/><text x="650" y="196" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >3</text><text x="682" y="196" font-size="25" font-weight="800" fill="#251d48" text-anchor="start" >Locker room</text><text x="636" y="244" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Undress fully;</text><text x="636" y="272" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >your phone stays</text><text x="636" y="300" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >locked away</text><rect x="904" y="150" width="255" height="196" rx="12" fill="#f3f0f9" stroke="#251d48" stroke-width="2"/><circle cx="938" cy="188" r="20" fill="#251d48"/><text x="938" y="196" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >4</text><text x="970" y="196" font-size="25" font-weight="800" fill="#251d48" text-anchor="start" >Showers</text><text x="924" y="244" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Wash with soap,</text><text x="924" y="272" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >hair too; tie long</text><text x="924" y="300" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >hair up</text><rect x="760.0" y="426" width="255" height="196" rx="12" fill="#f3f0f9" stroke="#251d48" stroke-width="2"/><circle cx="794.0" cy="464" r="20" fill="#251d48"/><text x="794.0" y="472" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >5</text><text x="826.0" y="472" font-size="25" font-weight="800" fill="#251d48" text-anchor="start" >Pools</text><text x="780.0" y="520" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Hot, herbal and a</text><text x="780.0" y="548" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >cold plunge; keep</text><text x="780.0" y="576" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >the towel out</text><rect x="472.0" y="426" width="255" height="196" rx="12" fill="#fbeec6" stroke="#251d48" stroke-width="2"/><circle cx="506.0" cy="464" r="20" fill="#251d48"/><text x="506.0" y="472" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >6</text><text x="538.0" y="472" font-size="25" font-weight="800" fill="#251d48" text-anchor="start" >Shared floor</text><text x="492.0" y="520" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Uniform on: kiln</text><text x="492.0" y="548" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >rooms, salt rooms,</text><text x="492.0" y="576" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >snack bar</text><rect x="184.0" y="426" width="255" height="196" rx="12" fill="#ffffff" stroke="#251d48" stroke-width="2"/><circle cx="218.0" cy="464" r="20" fill="#251d48"/><text x="218.0" y="472" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle" >7</text><text x="250.0" y="472" font-size="25" font-weight="800" fill="#251d48" text-anchor="start" >Leaving</text><text x="204.0" y="520" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Return the wristband</text><text x="204.0" y="548" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >and pay for any</text><text x="204.0" y="576" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >extras</text><rect x="40" y="652" width="28" height="28" rx="6" fill="#ffffff" stroke="#251d48" stroke-width="2"/><text x="80" y="674" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Entrance and counter</text><rect x="420" y="652" width="28" height="28" rx="6" fill="#f3f0f9" stroke="#251d48" stroke-width="2"/><text x="460" y="674" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Single-sex bathing area</text><rect x="800" y="652" width="28" height="28" rx="6" fill="#fbeec6" stroke="#251d48" stroke-width="2"/><text x="840" y="674" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Shared floor, men and women together</text><text x="40" y="724" font-size="20" font-weight="400" fill="#665e79" text-anchor="start" >Diagram by K-Spot Now from the guide&#x27;s own step list; venue rules vary, so follow the signs.</text></svg>
