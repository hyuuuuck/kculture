<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Weverse Lucky Store at Yongsan I'Park Mall</title>
  <desc id="desc">WEVERSE From 2025-12-08, until sold out Seoul / Weverse Shop Notices</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset="0.56" stop-color="#00c8b8"/>
      <stop offset="1" stop-color="#8ef4d7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
