name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-cloudflare-pages.yml"
      - "app.js"
      - "assets/**"
      - "data/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/**"
      - "src/**"
      - "styles.css"
      - "wrangler.toml"
  workflow_dispatch:
    inputs:
      require_adsense:
        description: "Require AdSense publisher ID before deploying"
        required: false
        type: boolean
        default: false
      strict_freshness:
        description: "Fail if live/upcoming listings exceed freshness windows"
        required: false
        type: boolean
        default: false
      refresh_sources:
        description: "Refresh official source candidates before building"
        required: false
        type: boolean
        default: true
      monitor_urls:
        description: "Comma-separated extra official URLs to scan once"
        required: false
        type: string

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://kspotnow.com' }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || 'contact@kspotnow.com' }}
      GOOGLE_ADSENSE_PUBLISHER_ID: ${{ vars.GOOGLE_ADSENSE_PUBLISHER_ID }}
      GOOGLE_ADSENSE_CLIENT: ${{ vars.GOOGLE_ADSENSE_CLIENT }}
      GOOGLE_ADSENSE_SLOT: ${{ vars.GOOGLE_ADSENSE_SLOT }}
      GOOGLE_ADSENSE_CMP_READY: ${{ vars.GOOGLE_ADSENSE_CMP_READY || '0' }}
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      ALLOW_PLATFORM_SUBDOMAIN: ${{ vars.ALLOW_PLATFORM_SUBDOMAIN || '0' }}
      CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME || 'kculture' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID || '338a3c1d6ab632a4c303e44d88e3ec78' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$SITE_URL" || { echo "SITE_URL repository variable is required."; exit 1; }
          test -n "$CONTACT_EMAIL" || { echo "CONTACT_EMAIL repository variable is required."; exit 1; }
          test -n "$CLOUDFLARE_WORKER_NAME" || { echo "CLOUDFLARE_WORKER_NAME repository variable is required."; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN secret is required."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID secret is required."; exit 1; }

      - name: Refresh official source status
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.refresh_sources }}
        run: npm run source:refresh
        env:
          SOURCE_TIMEOUT_MS: "12000"
          SOURCE_CONCURRENCY: "8"
          COLLECT_TIMEOUT_MS: "15000"
          COLLECT_CONCURRENCY: "8"
          COLLECT_MAX_LINKS: "24"
          COLLECT_MIN_LINK_SCORE: "7"
          MONITOR_URLS: ${{ inputs.monitor_urls || '' }}

      - name: Build production site
        run: npm run build

      - name: Validate production build
        env:
          REQUIRE_ADSENSE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_adsense && '1' || '0' }}
          STRICT_FRESHNESS: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_freshness && '1' || '0' }}
        run: |
          if [ "$REQUIRE_ADSENSE" = "1" ]; then
            npm run preflight:adsense
          else
            npm run validate:production
          fi
          if [ "$STRICT_FRESHNESS" = "1" ]; then
            CONTENT_FRESHNESS_STRICT=1 npm run validate:content
          else
            npm run validate:content
          fi
          npm run validate:sources
          npm run validate:links
          npm run validate:images
          npm run validate:thumbnail-audit
          npm run validate:calendar
          npm run validate:details
          npm run validate:ux
          npm run validate:workflows
          npm run validate:sitemap
          npm run validate:structured
          npm run validate:event-audit
          npm run report:adsense
          npm run quality:ceo

      - name: Upload source refresh artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-source-refresh-${{ github.run_id }}
          path: data/feeds/
          if-no-files-found: ignore
          retention-days: 14

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Print deployment URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          DEPLOYMENT_ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          echo "Deployment URL: $DEPLOYMENT_URL"
          echo "Deployment alias URL: $DEPLOYMENT_ALIAS_URL"
