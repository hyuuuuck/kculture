  <text x="600" y="604" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="850" opacity="0.82">From 2025-12-08, until sold out</text>
  <text x="1144" y="640" text-anchor="end" fill="#ffffff" font-size="18" font-weight="850" opacity="0.62">KOREA NOW GUIDE</text>
